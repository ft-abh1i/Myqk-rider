name: Auto-authorize riders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-authorize-riders.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark rider profiles active automatically
        shell: python
        run: |
          from pathlib import Path

          path = Path('app-core.js')
          text = path.read_text()
          old = '''    onboardingComplete: true,
    status: "offline",'''
          new = '''    onboardingComplete: true,
    isApproved: true,
    accountStatus: "active",
    status: "offline",'''
          if old not in text:
              raise SystemExit('Rider onboarding profile snippet was not found.')
          path.write_text(text.replace(old, new, 1))

      - name: Verify rider activation fields
        run: |
          grep -q "isApproved: true" app-core.js
          grep -q 'accountStatus: "active"' app-core.js

      - name: Commit rider auto-authorization
        run: |
          rm -f .github/workflows/auto-authorize-riders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-core.js .github/workflows/auto-authorize-riders.yml
          git commit -m "Auto-authorize riders after onboarding"
          git push
